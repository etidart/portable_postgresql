name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  artifact:
    # Heavy: downloads a full PostgreSQL build and runs PyInstaller.
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build artifact
        run: python build.py --out dist --log-level info

      - name: Smoke test (linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/pgportable version
          ./dist/pgportable --exec "SELECT version()" --no-dump-out --log-level info

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\pgportable.exe version
          .\dist\pgportable.exe --exec "SELECT version()" --no-dump-out --log-level info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgportable-${{ runner.os }}
          path: dist/
