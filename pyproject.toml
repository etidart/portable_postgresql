[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgportable"
version = "0.1.0"
description = "Build a single-file portable PostgreSQL executable that can load pg_dump files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7", "pyinstaller>=6.0"]

[project.scripts]
pgportable = "pgportable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
